<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="LMSCS by CodeBlender - Learning Management System Complete Solution">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040A16"/>
      <stop offset="0.55" stop-color="#071A35"/>
      <stop offset="1" stop-color="#0A2B5E"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="620" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#54D6FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#3C8DFF"/>
      <animate attributeName="x1" values="260;600;260" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="620;960;620" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54D6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#54D6FF"/>
      <stop offset="1" stop-color="#54D6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#54D6FF" stroke-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="440" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .f { font-family: 'Segoe UI','Inter','Roboto','Helvetica Neue',Arial,sans-serif; }
    .eyebrow { font-size: 22px; letter-spacing: 10px; fill: #7FB2FF; opacity: 0; animation: rise 1.2s 0.2s forwards; }
    .title { font-size: 172px; font-weight: 800; letter-spacing: 12px; }
    .glow { opacity: 0.4; animation: pulse 4s ease-in-out infinite; }
    .sub { font-size: 26px; letter-spacing: 6px; fill: #B9D4FF; opacity: 0; animation: rise 1.2s 0.7s forwards; }
    .tag { font-size: 34px; font-weight: 600; fill: #54D6FF; opacity: 0; animation: cycle 12s infinite; }
    .t1 { animation-delay: 1.5s; }
    .t2 { animation-delay: 4.5s; }
    .t3 { animation-delay: 7.5s; }
    .t4 { animation-delay: 10.5s; }
    .p { fill: #FFFFFF; opacity: 0.15; animation: tw 3s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.75; } }
    @keyframes tw { 0%, 100% { opacity: 0.12; } 50% { opacity: 1; } }
    @keyframes cycle { 0% { opacity: 0; } 4% { opacity: 1; } 22% { opacity: 1; } 26% { opacity: 0; } 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>

    <circle cx="180" cy="90" r="190" fill="#1468D4" opacity="0.45" filter="url(#blur)">
      <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;170;90" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="360" r="170" fill="#54D6FF" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="1040;900;1040" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;300;360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="30" r="140" fill="#12A594" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" values="720;860;720" dur="18s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(600 210)" fill="none">
      <circle r="250" stroke="#54D6FF" stroke-opacity="0.16" stroke-dasharray="2 14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
      </circle>
      <circle r="190" stroke="#3C8DFF" stroke-opacity="0.16" stroke-dasharray="46 20">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <circle cx="250" cy="0" r="6" fill="#54D6FF"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
        <circle cx="190" cy="0" r="5" fill="#FFFFFF"/>
      </g>
    </g>

    <circle class="p" cx="90" cy="60" r="2.5" style="animation-delay:0.2s"/>
    <circle class="p" cx="210" cy="340" r="2" style="animation-delay:1.1s"/>
    <circle class="p" cx="330" cy="130" r="3" style="animation-delay:0.6s"/>
    <circle class="p" cx="450" cy="400" r="2" style="animation-delay:1.8s"/>
    <circle class="p" cx="540" cy="46" r="2.5" style="animation-delay:2.2s"/>
    <circle class="p" cx="690" cy="404" r="3" style="animation-delay:0.9s"/>
    <circle class="p" cx="800" cy="70" r="2" style="animation-delay:1.5s"/>
    <circle class="p" cx="905" cy="250" r="2.5" style="animation-delay:0.4s"/>
    <circle class="p" cx="1010" cy="120" r="3" style="animation-delay:2.5s"/>
    <circle class="p" cx="1110" cy="330" r="2" style="animation-delay:1.3s"/>
    <circle class="p" cx="1140" cy="60" r="2.5" style="animation-delay:0.1s"/>
    <circle class="p" cx="60" cy="380" r="2" style="animation-delay:2s"/>

    <text class="f eyebrow" x="605" y="92" text-anchor="middle">BY CODEBLENDER</text>
    <text class="f title glow" x="606" y="240" text-anchor="middle" fill="#54D6FF" filter="url(#glow)">LMSCS</text>
    <text class="f title" x="606" y="240" text-anchor="middle" fill="url(#ink)">LMSCS</text>
    <text class="f sub" x="603" y="292" text-anchor="middle">LEARNING MANAGEMENT SYSTEM COMPLETE SOLUTION</text>

    <rect x="420" y="312" width="360" height="2" fill="url(#line)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <text class="f tag t1" x="600" y="372" text-anchor="middle">Teach. Manage. Sell. Scale.</text>
    <text class="f tag t2" x="600" y="372" text-anchor="middle">One engine. Every role. Total control.</text>
    <text class="f tag t3" x="600" y="372" text-anchor="middle">Grow it with addons in one click.</text>
    <text class="f tag t4" x="600" y="372" text-anchor="middle">Signed. Verified. Built to be trusted.</text>

    <rect x="-400" y="-60" width="260" height="620" fill="url(#sweep)" transform="rotate(18 0 0)">
      <animate attributeName="x" values="-400;1600" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="28" fill="none" stroke="#54D6FF" stroke-opacity="0.28"/>
</svg>
